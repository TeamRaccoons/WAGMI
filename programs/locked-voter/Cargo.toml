[package]
name = "locked-voter"
version = "0.2.0"
description = "Created with Anchor"
edition = "2021"


[lib]
crate-type = ["cdylib", "lib"]
name = "locked_voter"

[features]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
default = []
test-bpf = []


[dependencies]
anchor-lang = { version = "0.28.0", features = ["init-if-needed"] }
anchor-spl = "0.28.0"
govern = { path = "../govern", features = ["cpi"] }
smart-wallet = { path = "../smart-wallet", features = ["cpi"] }
num-traits = "0.2.16"
vipers = { path = "../../libs/vipers" }

[dev-dependencies]
proptest = { version = "1.0" }
